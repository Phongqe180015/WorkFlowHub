spring:
  application:
    name: WorkFlowHub

  # Profile mặc định (đổi giữa 'local' và 'dev')
  profiles:
    active: dev

  docker:
    compose:
      enabled: false

  # ============================================================
  # DATASOURCE (Cấu hình chung Hikari Pool)
  # Chi tiết URL/user/pass nằm trong application-local.yml và application-dev.yml
  # ============================================================
  datasource:
    hikari:
      pool-name: WorkFlowHubPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ============================================================
  # JPA / HIBERNATE
  # ============================================================
  jpa:
    hibernate:
      ddl-auto: none           # Flyway manages schema; Hibernate only validates
    show-sql: false                # Set to true for debug; never true in production
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC           # All timestamps stored in UTC
        order_inserts: true
        order_updates: true
        batch_versioned_data: true

  # ============================================================
  # FLYWAY (database migration)
  # ============================================================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

  # ============================================================
  # JACKSON
  # ============================================================
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
    time-zone: UTC

  # ============================================================
  # SECURITY (placeholder — expand in auth module)
  # ============================================================
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8080}

# ============================================================
# SERVER
# ============================================================
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,text/plain
    min-response-size: 1024

# ============================================================
# LOGGING
# ============================================================
logging:
  level:
    root: INFO
    com.workflowhub: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{requestId:-no-request-id}] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{requestId:-no-request-id}] %-5level %logger{36} - %msg%n"

# ============================================================
# SPRINGDOC / OPENAPI
# ============================================================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    persist-authorization: true
  show-actuator: false
