spring:
  application:
    name: WorkFlowHub

  # Profile mặc định (đổi giữa 'local' và 'dev')
  profiles:
    active: local

  docker:
    compose:
      enabled: false

  # ============================================================
  # DATASOURCE (Cấu hình chung Hikari Pool)
  # Chi tiết URL/user/pass nằm trong application-local.yml và application-dev.yml
  # ============================================================
  datasource:
    hikari:
      pool-name: WorkFlowHubPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ============================================================
  # JPA / HIBERNATE
  # ============================================================
  jpa:
    hibernate:
      ddl-auto: none           # Flyway manages schema; Hibernate only validates
    show-sql: false                # Set to true for debug; never true in production
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC           # All timestamps stored in UTC
        order_inserts: true
        order_updates: true
        batch_versioned_data: true

  # ============================================================
  # FLYWAY (database migration)
  # ============================================================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

  # ============================================================
  # JACKSON
  # ============================================================
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
    time-zone: UTC

  # ============================================================
  # SECURITY
  # ============================================================
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY:workflowhub-secret-key-must-be-at-least-256-bits-long-for-hmac-sha256-security!}
      # Access token: 30 minutes (1,800,000 ms), Refresh token: 7 days (604,800,000 ms)
      access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:1800000}
      refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8080}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: 2000ms
  cache:
    type: redis
    redis:
      time-to-live: 60000ms
      cache-null-values: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-256}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:workflowhub-notification-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.workflowhub.domain.workflow.main.event.dto.TaskAssignedEvent
# ============================================================
# SERVER
# ============================================================
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,text/plain
    min-response-size: 1024

# ============================================================
# LOGGING
# ============================================================
logging:
  level:
    root: INFO
    com.workflowhub: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{requestId:-no-request-id}] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{requestId:-no-request-id}] %-5level %logger{36} - %msg%n"

# ============================================================
# SPRINGDOC / OPENAPI
# ============================================================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    persist-authorization: true
  show-actuator: false

# ============================================================
# GOOGLE OAUTH & APP CONFIG
# ============================================================
google:
  client-id: ${GOOGLE_CLIENT_ID:}
  client-secret: ${GOOGLE_CLIENT_SECRET:}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

security:
  jwt:
    secret-key: ${JWT_SECRET:workflowhub-secret-key-must-be-at-least-256-bits-long-for-hmac-sha256-security!}
